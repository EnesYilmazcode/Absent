<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absent</title>
<style>
  :root { --bg:#07090d; --panel:#11151d; --line:#1e2531; --dim:#79859a;
          --ok:#31d0a5; --bad:#ff4d5e; --warn:#ffc44d; --sidebar:330px; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:#e9eef6; overflow:hidden;
         font:16px/1.45 -apple-system,Segoe UI,system-ui,sans-serif;
         display:grid; grid-template-columns:1fr var(--sidebar); }

  /* video fills everything left of the sidebar, no page chrome at all */
  .stage { position:relative; background:#000; overflow:hidden; }
  #feed { width:100%; height:100%; object-fit:contain; display:block;
          cursor:crosshair; user-select:none; -webkit-user-drag:none; }

  .wordmark { position:absolute; top:18px; right:22px; text-align:right;
              text-shadow:0 2px 14px rgba(0,0,0,.9); pointer-events:none; }
  .wordmark b { font-size:22px; letter-spacing:-0.02em; display:block; }
  .wordmark span { font-size:12px; color:var(--ok); }

  .controls { position:absolute; left:22px; bottom:22px; display:flex; gap:10px;
              align-items:center; flex-wrap:wrap; }
  button { padding:13px 20px; border-radius:9px; border:1px solid var(--line);
           background:rgba(20,25,34,.92); color:#e9eef6; font-size:15px;
           font-weight:600; cursor:pointer; backdrop-filter:blur(6px); }
  button:hover:not(:disabled) { background:rgba(38,46,62,.95); }
  button:disabled { opacity:.45; cursor:default; }
  #add { background:var(--ok); border-color:var(--ok); color:#04231b; }
  #verify { background:#2a2130; border-color:#4a3550; }
  #msg { position:absolute; left:22px; bottom:74px; font-size:13px;
         color:var(--dim); text-shadow:0 2px 10px #000; }

  /* sidebar: the manifest, one card per instrument */
  aside { background:var(--panel); border-left:1px solid var(--line);
          display:flex; flex-direction:column; min-height:0; }
  .head { padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  .head h2 { margin:0; font-size:12px; letter-spacing:.09em; color:var(--dim);
             text-transform:uppercase; }
  .head .n { font-size:26px; font-weight:700; letter-spacing:-0.02em; }
  .head .sub { font-size:12px; color:var(--dim); }
  .head .sub.disagree { color:var(--warn); }

  .cards { flex:1; overflow-y:auto; padding:14px; display:flex;
           flex-direction:column; gap:12px; min-height:0; }
  .card { background:#161b25; border:1px solid var(--line); border-radius:10px;
          overflow:hidden; display:flex; gap:12px; align-items:center; }
  .card img { width:88px; height:88px; object-fit:cover; background:#000;
              flex:none; }
  .card .meta { padding:8px 10px 8px 0; min-width:0; }
  .card .name { font-weight:650; font-size:15px; text-transform:capitalize;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .status { font-size:12px; color:var(--dim); }
  .card.gone { border-color:var(--bad); background:#25131a; }
  .card.gone .status { color:var(--bad); font-weight:650; }
  .card.ok .status { color:var(--ok); }
  .none { color:var(--dim); font-size:14px; padding:6px 4px; }

  .banner { padding:14px 18px; font-weight:650; font-size:15px;
            border-top:1px solid var(--line); }
  .banner.bad { background:#2b1119; color:var(--bad); }
  .banner.good { background:#0d251e; color:var(--ok); }
</style>
</head>
<body>

<div class="stage">
  <img id="feed" src="/feed" alt="instrument field">
  <div class="wordmark"><b>Absent</b><span>on-device &middot; no network</span></div>
  <div id="msg">Drag on the video to set the count zone</div>
  <div class="controls">
    <button id="add">Add item</button>
    <button id="verify">Count</button>
    <button id="clear">Reset</button>
  </div>
</div>

<aside>
  <div class="head">
    <h2>Manifest</h2>
    <div class="n" id="count">0 items</div>
    <div class="sub" id="cross"></div>
  </div>
  <div class="cards" id="cards">
    <div class="none">Hold an instrument up to the camera and press Add.</div>
  </div>
  <div class="banner" id="banner" hidden></div>
</aside>

<script>
const $ = id => document.getElementById(id);
const busy = on => ['add','verify','clear'].forEach(b => $(b).disabled = on);

function render(items, state) {
  $('count').textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
  $('cards').innerHTML = items.length ? items.map(i => `
    <div class="card ${i.status === 'unaccounted for' ? 'gone'
                     : i.status === 'accounted for' ? 'ok' : ''}">
      <img src="${i.file}" alt="${i.name}">
      <div class="meta">
        <div class="name">${i.name}</div>
        <div class="status">${i.status} &middot; ${i.at}</div>
      </div>
    </div>`).join('')
    : '<div class="none">Hold an instrument up to the camera and press Add.</div>';

  const gone = items.filter(i => i.status === 'unaccounted for');
  const banner = $('banner');
  banner.hidden = !items.length || items.every(i => i.status === 'counted in');
  banner.className = 'banner ' + (gone.length ? 'bad' : 'good');
  banner.textContent = gone.length
    ? `${gone.length} unaccounted for: ${gone.map(i => i.name).join(', ')}`
    : 'All items accounted for';

  // Two independent signals: Gemma names, segmentation counts shapes.
  const cross = $('cross');
  if (state && state.stage === 'counted_out') {
    const gap = Math.abs(state.segmented - state.named);
    cross.className = 'sub' + (gap > 1 ? ' disagree' : '');
    cross.textContent = `named ${state.named} · segmentation saw ${state.segmented}`
                      + (state.at_out ? ` · ${state.at_out}` : '');
  } else {
    cross.className = 'sub';
    cross.textContent = 'nothing counted yet';
  }
}

async function refresh() {
  const [items, state] = await Promise.all([
    (await fetch('/catalog/items')).json(),
    (await fetch('/state')).json()]);
  render(items, state);
}

$('add').onclick = async () => {
  busy(true); $('msg').textContent = 'naming and segmenting…';
  const r = await (await fetch('/catalog/add', {method:'POST'})).json();
  $('msg').textContent = r.ok ? `added ${r.item.name}` : r.error;
  await refresh(); busy(false);
};

$('verify').onclick = async () => {
  busy(true); $('msg').textContent = 'counting…';
  const r = await (await fetch('/verify', {method:'POST'})).json();
  const st = await (await fetch('/state')).json();
  $('msg').textContent = r.ok ? 'count complete'
                              : (st.error || r.error || 'count failed');
  await refresh(); busy(false);
};

$('clear').onclick = async () => {
  busy(true);
  await fetch('/catalog/clear', {method:'POST'});
  $('msg').textContent = 'cleared';
  await refresh(); busy(false);
};

// Drag anywhere on the video to redraw the count zone. Stored as fractions so
// it stays correct whatever resolution the phone or webcam is sending.
const feed = $('feed');
let anchor = null;
const at = e => {
  const r = feed.getBoundingClientRect();
  return {x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height};
};
feed.addEventListener('pointerdown', e => {
  anchor = at(e); feed.setPointerCapture(e.pointerId); e.preventDefault();
});
feed.addEventListener('pointerup', async e => {
  if (!anchor) return;
  const b = at(e), a = anchor; anchor = null;
  const zone = {x: Math.min(a.x, b.x), y: Math.min(a.y, b.y),
                w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y)};
  if (zone.w < 0.04 || zone.h < 0.04) return;
  await fetch('/zone', {method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify(zone)});
  $('msg').textContent = 'count zone set';
});

refresh();
setInterval(() => { if (!$('add').disabled) refresh(); }, 2000);
</script>
</body>
</html>
